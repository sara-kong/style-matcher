<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url("fonts/inter-latin.woff2") format("woff2"); }
  :root { --rose: #b89393; --paper: #f2f2f2; --ink: #000; --muted: #6f6767; --dot: #b2b2b2; --box: #d9d9d9; }
  body { margin: 0; width: 269px; background: var(--paper); color: var(--ink);
         font: 400 10px/1.2 Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  main { padding: 13px 15px 20px; }
  h1 { font-size: 12px; font-weight: 600; margin: 0 0 8px; }

  /* Status: the eight-dot ring from the icon; it spins while retraining. */
  #status { display: flex; align-items: center; gap: 3px; margin: 0 0 18px; }
  .ring { position: relative; width: 10px; height: 10px; flex: none; }
  .ring i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: var(--dot); }
  .ring i:nth-child(1) { left: 4px; top: 0; }     .ring i:nth-child(2) { left: 7px; top: 1px; }
  .ring i:nth-child(3) { left: 8px; top: 4px; }   .ring i:nth-child(4) { left: 7px; top: 7px; }
  .ring i:nth-child(5) { left: 4px; top: 8px; }   .ring i:nth-child(6) { left: 1px; top: 7px; }
  .ring i:nth-child(7) { left: 0; top: 4px; }     .ring i:nth-child(8) { left: 1px; top: 1px; }
  #status.busy .ring { animation: spin 1.1s steps(8) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #status.busy .ring { animation: none; } }

  dl { display: grid; grid-template-columns: 1fr auto; row-gap: 15px; margin: 0 0 27px; }
  dt, dd { margin: 0; } dd { text-align: right; font-variant-numeric: tabular-nums; }

  label.switch { display: flex; justify-content: space-between; align-items: center; margin-bottom: 38px; cursor: pointer; }
  label.switch input { appearance: none; margin: 0; width: 13px; height: 13px; border-radius: 3px;
                       background: var(--box); cursor: pointer; display: grid; place-content: center; }
  label.switch input:checked { background: var(--rose); }
  label.switch input:checked::after { content: ""; width: 3px; height: 6px; margin-top: -1px;
                       border: solid #fff; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }

  button { display: block; width: 200px; margin: 0 auto; padding: 10px; border: 0; border-radius: 5px; cursor: pointer;
           font: inherit; color: #fff; background: var(--rose); filter: drop-shadow(0 2px 2px var(--rose)); }
  button:hover { background: #a98282; }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid #4a7bd0; outline-offset: 2px; }
  #note { color: var(--muted); text-align: center; margin: 12px 0 0; min-height: 1.2em; }
  .help { color: var(--muted); margin: -10px 0 18px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 9px; }
</style>
</head>
<body>
<main>
  <h1>Taste Score</h1>
  <p id="status"><span class="ring" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span><span id="status-text">Checking the scoring server…</span></p>
  <p id="help" class="help" hidden></p>
  <dl id="stats" hidden>
    <dt>Liked</dt><dd id="like">–</dd>
    <dt>Disliked</dt><dd id="dislike">–</dd>
    <dt>Maybe</dt><dd id="maybe">–</dd>
    <dt>Cutoff</dt><dd id="cutoff">–</dd>
    <dt>Held-out AUC</dt><dd id="auc">–</dd>
  </dl>
  <label class="switch">Score images on pages <input type="checkbox" id="enabled"></label>
  <button id="retrain" disabled>Retrain with new labels</button>
  <p id="note" role="status"></p>
</main>
<script src="popup.js"></script>
</body>
</html>
